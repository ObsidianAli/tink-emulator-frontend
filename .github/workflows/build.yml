name: build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes
        required: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Tink
          path: |
            dist/Tink.zip
            dist/Tink.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Tink.zip dist/Tink.exe --title "Tink ${GITHUB_REF_NAME#v}" --notes-from-tag
      - name: Release from main
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "v$version" dist/Tink.zip dist/Tink.exe --target "$GITHUB_SHA" --title "Tink $version" --notes "$NOTES"
